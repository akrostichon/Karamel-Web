name: Backend CI/CD

on:
  push:
    branches:
      - feature/**
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore and build
        run: |
          dotnet restore
          dotnet build --no-restore --configuration Release
      - name: Run backend tests
        run: |
          dotnet test Karamel.Backend.Tests -c Release --no-build

  deploy-to-appservice:
    needs: build-and-test
    runs-on: [self-hosted, linux, rg-karamel-prod-runner]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      
      - name: Install required tools
        run: sudo apt-get update && sudo apt-get install -y zip
      
      - name: Login to Azure (Managed Identity)
        run: az login --identity
      
      - name: Publish backend
        run: |
          dotnet publish Karamel.Backend -c Release -o ./publish
          cd publish
          zip -r ../deploy.zip .
      
      - name: Deploy to App Service
        run: |
          az webapp deployment source config-zip \
            --resource-group rg-karamel-prod \
            --name rg-karamel-prod-api \
            --src deploy.zip
      
      - name: Verify deployment
        run: |
          echo "Waiting for app to restart..."
          sleep 30
          curl -f https://rg-karamel-prod-api.azurewebsites.net/health || echo "Health check failed"