name: Deploy Azure Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment (e.g., prod)'
        required: true
        default: 'prod'

jobs:
  deploy-infrastructure:
    runs-on: [self-hosted, linux, rg-karamel-prod-runner]
    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure (Managed Identity)
        run: az login --identity

      - name: Deploy Bicep template
        id: deploy
        run: |
          az deployment group create \
            --resource-group rg-karamel-prod \
            --template-file infra/azure/main.bicep \
            --parameters @infra/azure/parameters.json \
            --parameters sqlAdminPassword='${{ secrets.SQL_ADMIN_PASSWORD }}' \
            --query properties.outputs -o json > deployment-outputs.json
          
          cat deployment-outputs.json

      - name: Ensure KARAMEL-TOKEN-SECRET exists
        run: |
          KV_NAME=$(jq -r '.keyVaultName.value' deployment-outputs.json)
          
          # Check if secret exists
          if az keyvault secret show --vault-name $KV_NAME --name KARAMEL-TOKEN-SECRET &>/dev/null; then
            echo "✓ KARAMEL-TOKEN-SECRET already exists"
          else
            echo "! Creating KARAMEL-TOKEN-SECRET..."
            if [ -n "${{ secrets.KARAMEL_TOKEN_SECRET }}" ]; then
              az keyvault secret set \
                --vault-name $KV_NAME \
                --name KARAMEL-TOKEN-SECRET \
                --value '${{ secrets.KARAMEL_TOKEN_SECRET }}'
            else
              # Generate random secret
              TOKEN_SECRET=$(openssl rand -base64 48)
              az keyvault secret set \
                --vault-name $KV_NAME \
                --name KARAMEL-TOKEN-SECRET \
                --value "$TOKEN_SECRET"
              echo "⚠️ Generated random secret. Store securely!"
            fi
          fi

      - name: Configure App Service settings
        run: |
          WEBAPP_NAME=$(jq -r '.webAppName.value' deployment-outputs.json)
          KV_NAME=$(jq -r '.keyVaultName.value' deployment-outputs.json)
          SQL_SERVER=$(jq -r '.sqlServerName.value' deployment-outputs.json)
          SQL_DB=$(jq -r '.sqlDatabaseName.value' deployment-outputs.json)
          
          # Set app settings with Key Vault reference
          az webapp config appsettings set \
            --resource-group rg-karamel-prod \
            --name $WEBAPP_NAME \
            --settings \
              "KARAMEL-TOKEN-SECRET=@Microsoft.KeyVault(SecretUri=https://$KV_NAME.vault.azure.net/secrets/KARAMEL-TOKEN-SECRET/)" \
              "DB_PROVIDER=SqlServer" \
              "DB_USE_AAD=true" \
              "ASPNETCORE_ENVIRONMENT=Production" \
              "ConnectionStrings__DefaultConnection=Server=tcp:$SQL_SERVER.database.windows.net,1433;Database=$SQL_DB;Encrypt=True;TrustServerCertificate=False;Connection Timeout=30;"
          
          echo "✓ App Service configured"

      - name: Upload deployment outputs
        uses: actions/upload-artifact@v4
        with:
          name: deployment-outputs
          path: deployment-outputs.json