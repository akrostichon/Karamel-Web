name: Run EF Migrations

on:
  workflow_dispatch:
    inputs:
      resource_group:
        description: 'Resource Group'
        required: true
        default: 'rg-karamel-prod'
      sql_server_name:
        description: 'SQL Server name'
        required: true
        default: 'rg-karamel-prod-sqlsrv'
      sql_database_name:
        description: 'SQL Database name'
        required: true
        default: 'rg-karamel-prod-sqldb'
      project_path:
        description: 'Path to the backend project'
        required: true
        default: 'Karamel.Backend'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ${{ github.event.inputs.project_path }}

      - name: Build backend project
        run: dotnet build ${{ github.event.inputs.project_path }} --no-restore --configuration Release

      - name: Install EF Core tools
        run: dotnet tool install --global dotnet-ef

      - name: Create EF migration bundle
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          cd ${{ github.event.inputs.project_path }}
          dotnet ef migrations bundle --configuration Release --self-contained --runtime linux-x64 --output ./efbundle
          chmod +x ./efbundle
          ls -lh ./efbundle
        
      - name: Upload migration bundle
        uses: actions/upload-artifact@v4
        with:
          name: migration-bundle
          path: ${{ github.event.inputs.project_path }}/efbundle

  run-migrations:
    needs: build
    runs-on: [self-hosted, linux, rg-karamel-prod-runner]
    steps:
      - name: Download migration bundle
        uses: actions/download-artifact@v4
        with:
          name: migration-bundle
          path: ./bundle

      - name: Make bundle executable
        run: |
          chmod +x ./bundle/efbundle
          ls -lh ./bundle/efbundle
          echo "Bundle size: $(du -h ./bundle/efbundle | cut -f1)"

      - name: Login to Azure (VM Managed Identity)
        run: |
          echo "Logging in with VM managed identity..."
          az login --identity
          echo "✓ Azure login successful"

      - name: Get access token for SQL
        id: get-token
        run: |
          echo "Requesting SQL access token..."
          TOKEN=$(az account get-access-token --resource https://database.windows.net/ --query accessToken -o tsv)
          if [ -z "$TOKEN" ]; then
            echo "ERROR: Failed to get access token"
            exit 1
          fi
          echo "✓ Access token obtained (length: ${#TOKEN})"
          echo "::add-mask::$TOKEN"
          echo "SQL_ACCESS_TOKEN=$TOKEN" >> $GITHUB_ENV

      - name: Test SQL connectivity via Private Endpoint
        run: |
          echo "Testing connectivity to SQL Server private endpoint..."
          echo "Server: ${{ github.event.inputs.sql_server_name }}.database.windows.net"
          
          # Test DNS resolution
          nslookup ${{ github.event.inputs.sql_server_name }}.database.windows.net || echo "⚠ DNS resolution issue"
          
          # Test TCP connectivity
          timeout 5 bash -c "cat < /dev/null > /dev/tcp/${{ github.event.inputs.sql_server_name }}.database.windows.net/1433" && echo "✓ Port 1433 is reachable" || echo "✗ Cannot reach port 1433"

      - name: Run migration bundle
        run: |
          echo "=========================================="
          echo "Running EF Core migration bundle"
          echo "=========================================="
          echo "Server: ${{ github.event.inputs.sql_server_name }}.database.windows.net"
          echo "Database: ${{ github.event.inputs.sql_database_name }}"
          echo "Authentication: Azure AD Managed Identity"
          echo "Connection: Private Endpoint"
          echo "=========================================="
          
          # Build connection string for Azure SQL with managed identity
          export ConnectionStrings__DefaultConnection="Server=tcp:${{ github.event.inputs.sql_server_name }}.database.windows.net,1433;Database=${{ github.event.inputs.sql_database_name }};Authentication=Active Directory Default;Encrypt=True;TrustServerCertificate=False;Connection Timeout=30;"
          
          # Run the bundle with verbose output
          ./bundle/efbundle --verbose || {
            echo ""
            echo "=========================================="
            echo "❌ MIGRATION FAILED"
            echo "=========================================="
            echo "Troubleshooting steps:"
            echo "1. Check VM network access to private endpoint"
            echo "2. Verify VM managed identity has SQL permissions"
            echo "3. Check SQL Server firewall/private endpoint config"
            echo "4. Review connection string format"
            echo "=========================================="
            exit 1
          }
          
          echo ""
          echo "=========================================="
          echo "✓ MIGRATIONS COMPLETED SUCCESSFULLY"
          echo "=========================================="