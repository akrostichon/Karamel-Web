name: Run EF Migrations

on:
  workflow_dispatch:
    inputs:
      resource_group:
        description: 'Resource Group'
        required: true
        default: 'rg-karamel-prod'
      sql_server_name:
        description: 'SQL Server name'
        required: true
        default: 'rg-karamel-prod-sqlsrv'
      sql_database_name:
        description: 'SQL Database name'
        required: true
        default: 'rg-karamel-prod-sqldb'
      project_path:
        description: 'Path to the backend project'
        required: true
        default: 'Karamel.Backend'

jobs:
  run-migrations:
    runs-on: [self-hosted, linux, rg-karamel-prod-runner]
    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure (VM Managed Identity)
        run: az login --identity

      - name: Get VM public IP
        id: get-ip
        run: |
          VM_PUBLIC_IP=$(curl -s https://api.ipify.org)
          echo "VM_PUBLIC_IP=$VM_PUBLIC_IP" >> $GITHUB_ENV
          echo "VM Public IP: $VM_PUBLIC_IP"

      - name: Add firewall rule for VM
        run: |
          echo "Adding firewall rule for VM IP: $VM_PUBLIC_IP"
          az sql server firewall-rule create \
            --resource-group ${{ github.event.inputs.resource_group }} \
            --server ${{ github.event.inputs.sql_server_name }} \
            --name "github-runner-temp-${{ github.run_id }}" \
            --start-ip-address $VM_PUBLIC_IP \
            --end-ip-address $VM_PUBLIC_IP

      - name: Install dotnet SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install EF Core tools
        run: dotnet tool install --global dotnet-ef

      - name: Get access token for SQL
        id: get-token
        run: |
          TOKEN=$(az account get-access-token --resource https://database.windows.net/ --query accessToken -o tsv)
          echo "::add-mask::$TOKEN"
          echo "SQL_ACCESS_TOKEN=$TOKEN" >> $GITHUB_ENV

      - name: Run migrations (AAD auth)
        run: |
          # Build connection string with AAD token
          export ConnectionStrings__DefaultConnection="Server=tcp:${{ github.event.inputs.sql_server_name }}.database.windows.net,1433;Database=${{ github.event.inputs.sql_database_name }};Encrypt=True;TrustServerCertificate=False;Connection Timeout=30;"
          
          # Run migrations (EF Core will use DefaultAzureCredential from environment)
          cd ${{ github.event.inputs.project_path }}
          dotnet ef database update --no-build || {
            echo "Migration failed!"
            exit 1
          }
        env:
          AZURE_ACCESS_TOKEN: ${{ env.SQL_ACCESS_TOKEN }}

      - name: Remove firewall rule
        if: always()
        run: |
          echo "Removing temporary firewall rule..."
          az sql server firewall-rule delete \
            --resource-group ${{ github.event.inputs.resource_group }} \
            --server ${{ github.event.inputs.sql_server_name }} \
            --name "github-runner-temp-${{ github.run_id }}" || echo "Rule may have been already removed"