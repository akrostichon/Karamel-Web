services:
  - type: web
    name: karamel-web
    runtime: docker
    region: frankfurt
    plan: free
    branch: main
    dockerfilePath: ./Karamel.Backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:10000
      - key: PORT
        value: "10000"
      - key: ConnectionStrings__DefaultConnection
        value: Data Source=/tmp/karamel.db
      - key: Karamel__TokenSecret
        sync: false
      - key: Cors__AllowedOrigins__0
        value: https://karamel.karaoke-stage.workers.dev
      - key: Logging__LogLevel__Default
        value: Warning
      - key: Logging__LogLevel__Karamel
        value: Warning
      - key: Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command
        value: Warning
      - key: DOTNET_gcServer
        value: "0"
      - key: DOTNET_gcConcurrent
        value: "0"
      - key: DOTNET_TieredPGO
        value: "0"
      - key: DOTNET_TieredCompilation
        value: "1"
