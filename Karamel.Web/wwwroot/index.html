<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Karamel.Web</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.css" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon-32x32.png" />
    <link href="Karamel.Web.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
    
    <!-- Logger Configuration -->
    <script type="text/javascript">
        /**
         * Configure logging level for centralized JavaScript logger
         * Log Levels: 0=Debug, 1=Info, 2=Warn, 3=Error
         * 
         * Development (localhost): Debug (0) - Show all logs
         * Production: Warn (2) - Show only warnings and errors
         */
        (function() {
            const hostname = window.location.hostname;
            const isDevelopment = hostname === 'localhost' || hostname === '127.0.0.1' || hostname === '::1';
            window.logLevel = isDevelopment ? 0 : 2;
        })();
    </script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script type="module">
        import * as themeToggle from './js/themeToggle.js';
        window.themeToggle = themeToggle;
        // initialize theme on load
        themeToggle.initTheme();
    </script>
</body>

</html>
